annict_recent_sync:
  class: AnnictRecentSyncJob
  cron: "0 6 * * *"
  queue: annict_sync

annict_backfill:
  class: AnnictBackfillJob
  cron: "0 * * * *"
  queue: annict_sync

# 楽曲取り込みとは別に、Spotify 未連携の曲を照合する（見つからなかった曲は間隔を空けて再照合）
spotify_track_bulk_resolve:
  class: SpotifyTrackBulkResolveJob
  cron: "15 * * * *"
  queue: default

cover_image_bulk_resolve:
  class: CoverImageBulkResolveJob
  cron: "30 6 * * *"
  queue: default

# コンテナはTZ=Asia/Tokyoのため、cronはJSTで解釈される（db_dumpの明示は冗長だが安全のため残す）
db_dump:
  class: DbDumpJob
  cron: "0 4 * * * Asia/Tokyo"
  queue: default
