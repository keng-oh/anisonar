x-app: &app
  image: ${IMAGE:-ghcr.io/keng-oh/anisonar:latest}
  restart: unless-stopped
  volumes:
    # DbDumpJob（毎日04:00）の出力先。runnerのworkspace内はcheckoutで消えるため絶対パスにする。
    # 初回のみホスト側で: sudo mkdir -p /var/lib/anisonar/dumps && sudo chown 1000:1000 /var/lib/anisonar/dumps
    - /var/lib/anisonar/dumps:/rails/tmp/dumps
  environment:
    TZ: Asia/Tokyo
    RAILS_ENV: production
    RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    APP_HOST: ${APP_HOST}
    DB_HOST: db
    DB_PASSWORD: ${DB_PASSWORD}
    REDIS_URL: redis://redis:6379/0
    ANNICT_API_TOKEN: ${ANNICT_API_TOKEN}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
    SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
    N8N_API_TOKEN: ${N8N_API_TOKEN}
    RESEND_API_KEY: ${RESEND_API_KEY}
    MAILER_FROM: ${MAILER_FROM}
    MAILER_REPLY_TO: ${MAILER_REPLY_TO}
    DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
    NTFY_URL: ${NTFY_URL}
    NTFY_USERNAME: ${NTFY_USERNAME}
    NTFY_PASSWORD: ${NTFY_PASSWORD}
    FIRECRAWL_URL: ${FIRECRAWL_URL}
    FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  web:
    <<: *app
    ports:
      - '80:80'

  worker:
    <<: *app
    command: bundle exec sidekiq -C config/sidekiq.yml

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anisonar
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: anisonar_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anisonar -d anisonar_production']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # DB管理UI。外部に公開する場合はnginx proxy manager等でBasic認証を必須にすること
  pgweb:
    image: sosedoff/pgweb
    restart: unless-stopped
    command: --readonly
    environment:
      PGWEB_DATABASE_URL: postgres://anisonar:${DB_PASSWORD}@db:5432/anisonar_production?sslmode=disable
    ports:
      - '8081:8081'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
